<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Công ty mô phỏng</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 id="company-name">Công ty mô phỏng</h1>
    <span id="conn-status" class="conn-status conn-status--offline">đang kết nối…</span>
  </header>

  <main>
    <section id="building-wrap" aria-label="Toà nhà công ty">
      <div id="building"></div>
    </section>
    <div id="time-bar" aria-label="Điều khiển thời gian">
      <button id="time-toggle" type="button">Xem lịch sử ⏱</button>
      <div id="time-controls" hidden>
        <button id="time-play" type="button" aria-label="Phát / tạm dừng">▶</button>
        <select id="time-speed" aria-label="Tốc độ tua">
          <option value="1">1x</option>
          <option value="5">5x</option>
          <option value="20">20x</option>
        </select>
        <div id="time-track-wrap">
          <div id="time-markers"></div>
          <input id="time-slider" type="range" min="0" max="1000" value="1000" step="1" />
        </div>
        <span id="time-label">--</span>
        <button id="time-live" type="button">Về trực tiếp</button>
      </div>
    </div>
    <aside id="activity" aria-label="Nhật ký hoạt động">
      <h2>Nhật ký</h2>
      <ol id="activity-list"></ol>
    </aside>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
